<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shapeshifter</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #000; }
        #map { height: 100vh; width: 100vw; }
        
        /* Control Panel Styles */
        #control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 360px;
            max-height: calc(100vh - 30px);
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .panel-section { margin-bottom: 15px; }
        .panel-heading { font-weight: bold; margin-bottom: 8px; display: block; font-size: 16px; }
        
        /* Search Bar */
        .search-container { display: flex; gap: 5px; }
        #search-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px; 
        }
        
        /* Dropdown */
        #pretraced-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        /* Buttons */
        button {
            padding: 12px 18px;
            background: #2a75d3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: background 0.2s;
        }
        button:hover { background: #1b5baf; }
        
        .btn-action { background: #ff2a00; }
        .btn-action:hover { background: #cc2200; }
        .btn-full { width: 100%; padding: 14px; margin-top: 5px; font-size: 18px; }
        .btn-import { background: #444; }
        .btn-import:hover { background: #222; }
        
        /* Save Form Styles */
        #shape-name {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        /* Saved Shapes List */
        #saved-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 15px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .saved-item {
            display: flex;
            flex-direction: column;
            background: #f4f4f4;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
        }
        .saved-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 10px;
        }
        .color-picker {
            cursor: pointer;
            border: none;
            width: 30px;
            height: 30px;
            padding: 0;
            background: none;
        }
        
        /* Individual Shape Controls */
        .shape-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .export-controls {
            display: flex;
            gap: 6px;
        }
        
        .shape-controls button, .export-controls button {
            padding: 10px;
            font-size: 14px;
        }
        
        /* Button Sizing & Coloring */
        .btn-teleport { background: #008f51; flex: 1 1 100% !important; }
        .btn-teleport:hover { background: #006b3c; }
        
        .btn-initial { background: #b05c00; flex: 1 1 100% !important; }
        .btn-initial:hover { background: #8a4800; }
        
        .btn-duplicate { background: #6b3e99; flex: 1 1 30% !important; padding: 10px 5px !important; }
        .btn-duplicate:hover { background: #522d7a; }

        .btn-rename { background: #0056b3; flex: 1 1 30% !important; padding: 10px 5px !important; }
        .btn-rename:hover { background: #004085; }
        
        .btn-delete { background: #c70000; flex: 1 1 30% !important; padding: 10px 5px !important; }
        .btn-delete:hover { background: #940000; }
        
        .export-controls button { background: #444; flex: 1; padding: 10px 5px; }
        .export-controls button:hover { background: #222; }

        /* Make Geoman Toolbar Larger */
        .leaflet-pm-toolbar {
            transform: scale(1.3);
            transform-origin: top left;
            margin-top: 15px !important;
            margin-left: 15px !important;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <span>Shapeshifter</span>
            <button id="toggle-panel-btn" style="padding: 2px 8px; font-size: 16px; background: none; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;" title="Minimize Panel">-</button>
        </div>
        <div id="panel-content" style="margin-top: 15px;">
        <div class="panel-section">
            <span class="panel-heading">Find a location</span>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="e.g. Cedar Point, Ohio" />
                <button id="search-btn">Go</button>
            </div>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        
        <div class="panel-section">
            <span class="panel-heading">Pretraced Tracks</span>
            <select id="pretraced-select">
                <option value="">Select a track...</option>
                
                <optgroup label="SBNO Coasters">
                    <option value="arieforce.geojson">ArieForce One (Fun Spot Atlanta)</option>
					<option value="Arkansas_Twister.geojson">Arkansas Twister (Magic Springs)</option>
                    <option value="Dragon_Mountain.geojson">Dragon Mountain (Marineland)</option>
                    <option value="Hell_Cat.geojson">Hell Cat (Clementon)</option>
                    <option value="Silver_Comet.geojson">Silver Comet (Niagara)</option>
					<option value="Superman.geojson">Superman: Ride of Steel (Six Flags America)</option>
					<option value="switchback.geojson">Switchback (ZDT)</option>
                    <option value="WildOne.geojson">Wild One (Six Flags America)</option>
                </optgroup>
                </optgroup>

                <optgroup label="California's Great America">
                    <option value="Demon.geojson">Demon (California's Great America)</option>
                    <option value="Flight_Deck.geojson">Flight Deck (California's Great America)</option>
                    <option value="Gold_Striker.geojson">Gold Striker (California's Great America)</option>
                    <option value="Grizzly.geojson">Grizzly (California's Great America)</option>
                    <option value="Lucy's_Crabbie_Cabbies.geojson">Lucy's Crabbie Cabbies (California's Great America)</option>
                    <option value="Patriot.geojson">Patriot (California's Great America)</option>
                    <option value="Psycho_Mouse.geojson">Psycho Mouse (California's Great America)</option>
                    <option value="RailBlazer.geojson">RailBlazer (California's Great America)</option>
                    <option value="Woodstock_Express.geojson">Woodstock Express (California's Great America)</option>
                </optgroup>

                <optgroup label="Stock Models">
                    <option value="Vekoma_Boomerang.geojson">Vekoma Boomerang</option>
					<option value="Vekoma_Family_Boomerang_(185m).geojson">Vekoma Family Boomerang (185m)</option>
                    <option value="Vekoma_Family_Boomerang.geojson">Vekoma Family Boomerang (208m)</option>
					<option value="Vekoma_Dueling_Family_Boomerangs_(Tweestryd).geojson">Vekoma Dueling Family Boomerangs (Tweestryd)</option>
                    <option value="Vekoma_SLC.geojson">Vekoma SLC</option>
					<option value="Siren's_Curse.geojson">Vekoma Cliffhanger (Siren's Curse)</option>
                    <option value="Circuit_Breaker.geojson">Vekoma Pitfall (Circuit Breaker)</option>
                </optgroup>

                <optgroup label="Other">
                    <option value="Roar-o-Saurus.geojson">Roar-o-Saurus (Story Land)</option>
					<option value="Wooden_Warrior.geojson">Wooden Warrior (Quassy)</option>
                </optgroup>
            </select>
        </div>

        <div class="panel-section">
            <span class="panel-heading">Import shape</span>
            <input type="file" id="file-import" accept=".geojson,.json,.gpx,.kml,.kmz" style="display: none;" />
            <button id="import-btn" class="btn-full btn-import">Upload File</button>
        </div>

        <details class="panel-section" style="background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
            <summary class="panel-heading" style="cursor:pointer; margin-bottom: 0;">Custom Basemaps</summary>
            
            <div style="margin-top: 10px;">
                <strong>From WMS/Tile Server:</strong>
                <input type="text" id="custom-layer-url" placeholder="URL (e.g. https://... or WMS)" style="width:100%; margin-top:5px; margin-bottom:5px; padding:8px; box-sizing:border-box; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="custom-layer-name" placeholder="WMS Layer Name (if WMS)" style="width:100%; margin-bottom:5px; padding:8px; box-sizing:border-box; border: 1px solid #ccc; border-radius: 4px;">
                <button id="add-custom-layer-btn" class="btn-full btn-import" style="padding:8px; font-size:14px; margin-bottom:10px;">Add Server Layer</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">

            <div>
                <strong>From Local GeoTIFF:</strong>
                <input type="file" id="geotiff-import" accept=".tif,.tiff" style="display: none;" />
                <button id="import-geotiff-btn" class="btn-full btn-import" style="padding:8px; font-size:14px; margin-top:5px;">Upload GeoTIFF</button>
            </div>
        </details>

        <div class="panel-section">
            <span class="panel-heading">Active layer</span>
            <select id="save-target-select" style="width: 100%; margin-bottom: 8px; padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                <option value="new">Create new layer</option>
            </select>
            <input type="text" id="shape-name" placeholder="Name your shape..." />
            <button id="save-shape-btn" class="btn-full btn-action">Finish feature</button>
            <script>
                document.getElementById('save-target-select').addEventListener('change', function(e) {
                    document.getElementById('shape-name').style.display = e.target.value === 'new' ? 'block' : 'none';
                });
            </script>
            <label style="display: block; margin-top: 10px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" id="snap-self-toggle"> Snap drawing to start (closed line)
            </label>
            <label style="display: block; margin-top: 5px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" id="snap-other-toggle"> Snap to other features (Tracing)
            </label>
            <label style="display: block; margin-top: 5px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" id="teleport-shape-checkbox"> Teleport track to current view when adding
            </label>
            <label style="display: block; margin-top: 5px; font-size: 14px; cursor: pointer;">
                <input type="checkbox" id="group-move-toggle" checked> Grouped features move/rotate as one unit
            </label>
        </div>

        <div id="saved-list">
        </div>
        </div> <!-- End of panel-content -->
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
    
    <script src="https://unpkg.com/togpx@1.1.0/togpx.js"></script>
    <script src="https://unpkg.com/tokml@0.4.0/tokml.js"></script>
    
    <script src="https://unpkg.com/@tmcw/togeojson@4.4.1/dist/togeojson.umd.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

    <script>
        // Panel Toggle Logic
        document.getElementById('toggle-panel-btn').addEventListener('click', function() {
            const content = document.getElementById('panel-content');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                this.innerText = '-';
            } else {
                content.style.display = 'none';
                this.innerText = '+';
            }
        });

        // 1. Initialize Map
        const canvasRenderer = L.canvas({ tolerance: 25 });
        
        // Basemaps
        const esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri',
            maxNativeZoom: 19,
            maxZoom: 24
        });
        
        const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxNativeZoom: 19,
            maxZoom: 24
        });
        
        const usgsImageryTopo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'USGS The National Map (Topo)',
            maxNativeZoom: 16,
            maxZoom: 24
        });
        
        const usgsImageryOnly = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'USGS The National Map (Imagery)',
            maxNativeZoom: 16,
            maxZoom: 24
        });

        const map = L.map('map', { 
            renderer: canvasRenderer,
            layers: [esriImagery],
            maxZoom: 24,
            zoomControl: true,
            zoomSnap: 0,
            wheelPxPerZoomLevel: 60
        }).setView([33.4565, -84.4251], 16);

        // Inject smooth fractional zoom slider
        const zoomContainer = document.querySelector('.leaflet-control-zoom');
        if (zoomContainer) {
            const toggleBtn = document.createElement('a');
            toggleBtn.innerHTML = '↕';
            toggleBtn.href = '#';
            toggleBtn.title = 'Toggle Smooth Zoom';
            toggleBtn.role = 'button';
            toggleBtn.style.cursor = 'pointer';
            toggleBtn.style.fontSize = '18px';
            toggleBtn.style.lineHeight = '26px';
            toggleBtn.style.textAlign = 'center';

            const sliderWrapper = document.createElement('div');
            sliderWrapper.style.height = '0px';
            sliderWrapper.style.overflow = 'hidden';
            sliderWrapper.style.transition = 'height 0.3s ease';
            sliderWrapper.style.display = 'flex';
            sliderWrapper.style.justifyContent = 'center';
            sliderWrapper.style.alignItems = 'center';
            sliderWrapper.style.backgroundColor = '#fff';

            const sliderContainer = document.createElement('div');
            sliderContainer.style.position = 'relative';
            sliderContainer.style.width = '20px';
            sliderContainer.style.height = '200px';

            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = 0;
            slider.max = 24;
            slider.step = 0.01;
            slider.value = map.getZoom();
            
            slider.style.position = 'absolute';
            slider.style.width = '200px';
            slider.style.height = '20px';
            slider.style.left = '-90px';
            slider.style.top = '90px';
            slider.style.transform = 'rotate(270deg)';
            slider.style.margin = '0';
            slider.style.cursor = 'pointer';
            slider.style.outline = 'none';

            sliderContainer.appendChild(slider);
            sliderWrapper.appendChild(sliderContainer);
            
            const zoomOut = document.querySelector('.leaflet-control-zoom-out');
            zoomContainer.insertBefore(toggleBtn, zoomOut);
            zoomContainer.insertBefore(sliderWrapper, zoomOut);

            L.DomEvent.disableClickPropagation(toggleBtn);
            L.DomEvent.disableClickPropagation(sliderWrapper);

            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (sliderWrapper.style.height === '0px') {
                    sliderWrapper.style.height = '208px';
                    slider.value = map.getZoom(); // sync just in case
                } else {
                    sliderWrapper.style.height = '0px';
                }
            });

            let isDragging = false;
            let startZoom;
            let startOffset;
            let viewHalf;

            slider.addEventListener('mousedown', function() {
                isDragging = true;
                startZoom = map.getZoom();
                startOffset = map._getMapPanePos();
                viewHalf = map.getSize().divideBy(2);
                
                // Prevent tile loading while dragging slider to avoid flickering
                map._animatingZoom = true;
            });

            slider.addEventListener('input', function() {
                if (!isDragging) return;
                const targetZoom = parseFloat(this.value);
                const scale = map.getZoomScale(targetZoom, startZoom);
                
                // Mathematically perfectly scale the existing mapPane without fetching any new tiles
                const currentOffset = viewHalf.multiplyBy(1 - scale).add(startOffset.multiplyBy(scale));
                L.DomUtil.setTransform(map._mapPane, currentOffset, scale);
            });

            window.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    map._animatingZoom = false; // Re-enable tile fetching
                    
                    const targetZoom = parseFloat(slider.value);
                    
                    // Leaflet automatically clears transform when setZoom is called
                    map.setZoom(targetZoom, { animate: false });
                }
            });

            map.on('zoom', function() {
                if (!isDragging) slider.value = map.getZoom();
            });
        }

        // Add Layer Control for Basemaps
        const baseMaps = {
            "Esri Satellite": esriImagery,
            "USGS Imagery (No Labels)": usgsImageryOnly,
            "USGS Imagery Topo": usgsImageryTopo,
            "OpenStreetMap": osmMap
        };
        const layerControl = L.control.layers(baseMaps, null, {position: 'bottomright'}).addTo(map);

        // Custom Layer Logic
        let customLayerCount = 1;
        document.getElementById('add-custom-layer-btn').addEventListener('click', async () => {
            const url = document.getElementById('custom-layer-url').value.trim();
            const wmsLayer = document.getElementById('custom-layer-name').value.trim();
            if (!url) return;

            let layerName = wmsLayer || '';
            if (!layerName) {
                const urlParts = url.replace(/\/$/, '').split('/');
                for (let i = urlParts.length - 1; i >= 0; i--) {
                    const p = urlParts[i].toLowerCase();
                    if (p === 'mapserver' || p === 'imageserver') {
                        if (i > 0) {
                            layerName = urlParts[i - 1];
                            // Replace underscores with spaces for readability
                            layerName = layerName.replace(/_/g, ' ');
                            break;
                        }
                    }
                }
                if (!layerName) {
                    layerName = `Custom Layer ${customLayerCount++}`;
                }
            }

            let newLayer;
            
            // Clean up the URL for WMS by removing parameters Leaflet adds automatically
            let cleanUrl = url;
            try {
                const urlObj = new URL(url);
                ['request', 'REQUEST', 'service', 'SERVICE', 'version', 'VERSION'].forEach(p => urlObj.searchParams.delete(p));
                cleanUrl = urlObj.toString();
            } catch (e) {}

            if (wmsLayer || url.toLowerCase().includes('wms')) {
                let finalWmsLayer = wmsLayer;
                if (!finalWmsLayer) {
                    try {
                        const capUrl = new URL(cleanUrl);
                        capUrl.searchParams.set('request', 'GetCapabilities');
                        capUrl.searchParams.set('service', 'WMS');
                        const response = await fetch(capUrl.toString());
                        const text = await response.text();
                        const layerMatch = text.match(/<Layer[^>]*>[\s\S]*?<Name>([^<]+)<\/Name>/i);
                        if (layerMatch && layerMatch[1]) {
                            finalWmsLayer = layerMatch[1];
                        }
                    } catch (e) {
                        console.warn("Could not auto-detect WMS layer name.");
                    }
                }
                
                newLayer = L.tileLayer.wms(cleanUrl, {
                    layers: finalWmsLayer || '0', 
                    format: 'image/png',
                    transparent: true,
                    attribution: 'Custom WMS',
                    maxZoom: 24
                });
            } else if (url.toLowerCase().includes('imageserver') && !url.includes('{z}')) {
                newLayer = L.esri.imageMapLayer({
                    url: url,
                    opacity: 1,
                    maxZoom: 24
                });
            } else if (url.toLowerCase().includes('mapserver') && !url.includes('{z}')) {
                let isCached = false;
                try {
                    const response = await fetch(url + '?f=json');
                    const data = await response.json();
                    if (data.singleFusedMapCache) isCached = true;
                } catch (e) {
                    console.warn("Could not determine map cache status, defaulting to dynamic.");
                }
                
                if (isCached) {
                    newLayer = L.esri.tiledMapLayer({
                        url: url,
                        opacity: 1,
                        maxZoom: 24
                    });
                } else {
                    newLayer = L.esri.dynamicMapLayer({
                        url: url,
                        opacity: 1,
                        maxZoom: 24
                    });
                }
            } else {
                newLayer = L.tileLayer(url, {
                    attribution: 'Custom Tile Layer',
                    maxNativeZoom: 19,
                    maxZoom: 24
                });
            }

            layerControl.addBaseLayer(newLayer, layerName);
            newLayer.addTo(map);

            alert(`Added ${layerName} to map and layer controls!`);
            document.getElementById('custom-layer-url').value = '';
            document.getElementById('custom-layer-name').value = '';
        });

        // GeoTIFF Import Logic
        document.getElementById('import-geotiff-btn').addEventListener('click', () => document.getElementById('geotiff-import').click());
        document.getElementById('geotiff-import').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const georaster = await parseGeoraster(arrayBuffer);
                const geoTiffLayer = new GeoRasterLayer({
                    georaster: georaster,
                    opacity: 1,
                    resolution: 256
                });
                
                const layerName = file.name;
                layerControl.addBaseLayer(geoTiffLayer, layerName);
                geoTiffLayer.addTo(map);
                map.fitBounds(geoTiffLayer.getBounds());
                alert(`Added ${layerName} to basemaps!`);
            } catch (err) {
                console.error(err);
                alert("Error loading GeoTIFF: " + err.message);
            }
            e.target.value = '';
        });

        // 2. Configure Geoman Toolbar
        map.pm.addControls({
            position: 'topleft',
            drawMarker: false,
            drawCircleMarker: false,
            drawPolyline: true,
            drawPolygon: true,
            drawRectangle: false,
            drawCircle: false,
            drawText: false,
            editMode: true,
            dragMode: true,
            rotateMode: true,
            removalMode: true,
            cutPolygon: false
        });

        // Toggle Snap Logic
        const snapSelfToggle = document.getElementById('snap-self-toggle');
        const snapOtherToggle = document.getElementById('snap-other-toggle');
        function updateSnap() {
            map.pm.setGlobalOptions({
                snappable: snapSelfToggle.checked || snapOtherToggle.checked,
                snapDistance: 20,
                snapToSelf: snapSelfToggle.checked
            });
        }
        snapSelfToggle.addEventListener('change', updateSnap);
        snapOtherToggle.addEventListener('change', updateSnap);
        updateSnap(); // initialize

        // 3. State Management
        let savedShapesData = [];
        let activeDrawnLayers = L.featureGroup().addTo(map);

        map.on('pm:create', (e) => {
            const targetSelect = document.getElementById('save-target-select');
            const targetId = targetSelect ? targetSelect.value : 'new';

            if (targetId === 'new') {
                activeDrawnLayers.addLayer(e.layer);
            } else {
                const targetShape = savedShapesData.find(s => s.id == targetId);
                if (targetShape) {
                    if (e.layer.setStyle) {
                        e.layer.setStyle({
                            color: targetShape.color,
                            weight: 4,
                            opacity: 1,
                            fillColor: targetShape.color
                        });
                    }
                    
                    if (!e.layer.feature) e.layer.feature = { type: "Feature", properties: {} };
                    if (!e.layer.feature.properties) e.layer.feature.properties = {};
                    e.layer.feature.properties.stroke = targetShape.color;
                    e.layer.feature.properties.fill = targetShape.color;

                    targetShape.layerGroup.addLayer(e.layer);
                    renderSavedList();
                } else {
                    activeDrawnLayers.addLayer(e.layer);
                }
            }
        });

        function removeLayerFromGroup(group, layerToRemove) {
            if (group.hasLayer && group.hasLayer(layerToRemove)) {
                group.removeLayer(layerToRemove);
                return true;
            }
            if (group.eachLayer) {
                let removed = false;
                group.eachLayer(l => {
                    if (l.eachLayer && removeLayerFromGroup(l, layerToRemove)) removed = true;
                });
                return removed;
            }
            return false;
        }

        map.on('pm:remove', (e) => {
            const removedLayer = e.layer;
            let listChanged = false;

            if (activeDrawnLayers.hasLayer(removedLayer)) {
                activeDrawnLayers.removeLayer(removedLayer);
            }

            for (let i = savedShapesData.length - 1; i >= 0; i--) {
                const shape = savedShapesData[i];
                if (removeLayerFromGroup(shape.layerGroup, removedLayer)) {
                    listChanged = true;
                    if (getAllLeafLayers(shape.layerGroup).length === 0) {
                        savedShapesData.splice(i, 1);
                    }
                }
            }

            if (listChanged) {
                renderSavedList();
            }
        });

        // --- Group Synchronization Engine (Drag & Rotate) ---
        function cloneLatLngs(latlngs) {
            if (!latlngs) return null;
            if (Array.isArray(latlngs)) return latlngs.map(ll => Array.isArray(ll) ? cloneLatLngs(ll) : L.latLng(ll.lat, ll.lng));
            return L.latLng(latlngs.lat, latlngs.lng);
        }

        function getFirstLatLng(latlngs) {
            if (Array.isArray(latlngs)) return getFirstLatLng(latlngs[0]);
            if (latlngs && latlngs.lat !== undefined) return latlngs;
            if (latlngs && typeof latlngs.getLatLng === 'function') return latlngs.getLatLng();
            return latlngs;
        }

        function shiftCoordsByDelta(latlngs, dLat, dLng) {
            if (!latlngs) return null;
            if (Array.isArray(latlngs)) return latlngs.map(ll => Array.isArray(ll) ? shiftCoordsByDelta(ll, dLat, dLng) : L.latLng(ll.lat + dLat, ll.lng + dLng));
            return L.latLng(latlngs.lat + dLat, latlngs.lng + dLng);
        }

        function rotateCoordsAroundCenter(latlngs, center, angleDeg) {
            if (!latlngs) return null;
            if (Array.isArray(latlngs)) return latlngs.map(ll => Array.isArray(ll) ? rotateCoordsAroundCenter(ll, center, angleDeg) : rotateSingle(ll, center, angleDeg));
            return rotateSingle(latlngs, center, angleDeg);
        }

        function rotateSingle(latlng, center, angleDeg) {
            const angleRad = angleDeg * (Math.PI / 180);
            const cos = Math.cos(angleRad);
            const sin = Math.sin(angleRad);

            // Use exact same projection Geoman uses natively to eliminate any floating point/zoom drift
            const p = map.project(latlng);
            const c = map.project(center);
            
            const dx = p.x - c.x;
            const dy = p.y - c.y;
            
            const newDx = dx * cos - dy * sin;
            const newDy = dx * sin + dy * cos;
            
            return map.unproject(L.point(c.x + newDx, c.y + newDy));
        }

        function getAllLeafLayers(group) {
            let layers = [];
            if (group.eachLayer) {
                group.eachLayer(l => {
                    if (l.eachLayer) layers = layers.concat(getAllLeafLayers(l));
                    else layers.push(l);
                });
            } else {
                layers.push(group);
            }
            return layers;
        }

        function groupHasLayer(group, targetLayer) {
            return getAllLeafLayers(group).includes(targetLayer);
        }

        let groupMoveData = null;
        let groupRotateData = null;

        function handleDragStart(e) {
            const layer = e.layer || e.target;
            const moveAsUnit = document.getElementById('group-move-toggle');
            if (!moveAsUnit || !moveAsUnit.checked) return;
            const shape = savedShapesData.find(s => groupHasLayer(s.layerGroup, layer));
            if (shape) {
                const allLayers = getAllLeafLayers(shape.layerGroup);
                if (allLayers.length > 1) {
                    const otherLayers = allLayers.filter(l => l !== layer);
                    groupMoveData = {
                        baseLayer: layer,
                        baseStartCoords: layer.getLatLngs ? cloneLatLngs(layer.getLatLngs()) : cloneLatLngs([layer.getLatLng()]),
                        otherLayers: otherLayers.map(l => ({
                            layer: l,
                            startCoords: l.getLatLngs ? cloneLatLngs(l.getLatLngs()) : cloneLatLngs([l.getLatLng()])
                        }))
                    };
                }
            }
        }
        
        function handleDrag(e) {
            const layer = e.layer || e.target;
            if (!groupMoveData || groupMoveData.baseLayer !== layer) return;
            const currentFirst = getFirstLatLng(layer.getLatLngs ? layer.getLatLngs() : layer.getLatLng());
            const startFirst = getFirstLatLng(groupMoveData.baseStartCoords);
            if (!currentFirst || !startFirst) return;
            
            const dLat = currentFirst.lat - startFirst.lat;
            const dLng = currentFirst.lng - startFirst.lng;
            groupMoveData.otherLayers.forEach(obj => {
                if (obj.layer.setLatLngs) obj.layer.setLatLngs(shiftCoordsByDelta(obj.startCoords, dLat, dLng));
                else if (obj.layer.setLatLng) obj.layer.setLatLng(shiftCoordsByDelta(obj.startCoords, dLat, dLng)[0]);
            });
        }
        
        function handleDragEnd(e) { groupMoveData = null; }

        function handleRotateStart(e) {
            const layer = e.layer || e.target;
            const moveAsUnit = document.getElementById('group-move-toggle');
            if (!moveAsUnit || !moveAsUnit.checked) return;
            const shape = savedShapesData.find(s => groupHasLayer(s.layerGroup, layer));
            if (shape) {
                const allLayers = getAllLeafLayers(shape.layerGroup);
                if (allLayers.length > 1) {
                    const otherLayers = allLayers.filter(l => l !== layer);
                    
                    // Let Geoman rotate the active layer natively around its own center,
                    // and we will seamlessly orbit all other layers around that very same point!
                    const center = (layer.pm && layer.pm._rotationCenter) ? layer.pm._rotationCenter.getLatLng() : layer.getBounds().getCenter();
                    
                    groupRotateData = {
                        baseLayer: layer,
                        center: center,
                        accumulatedAngle: 0,
                        otherLayers: otherLayers.map(l => ({
                            layer: l,
                            startCoords: l.getLatLngs ? cloneLatLngs(l.getLatLngs()) : cloneLatLngs([l.getLatLng()])
                        }))
                    };
                }
            }
        }
        
        function handleRotate(e) {
            const layer = e.layer || e.target;
            if (!groupRotateData || groupRotateData.baseLayer !== layer) return;
            
            // We MUST exclusively use e.angleDiff because startCoords are captured exactly at rotatestart.
            // If we use e.angle, and e.angle carries absolute state (e.g. 180 degrees from a previous rotate),
            // applying it to fresh startCoords will teleport the shape instantly!
            groupRotateData.accumulatedAngle += (e.angleDiff || 0);
            const currentAngle = groupRotateData.accumulatedAngle;
            
            groupRotateData.otherLayers.forEach(obj => {
                if (obj.layer.setLatLngs) obj.layer.setLatLngs(rotateCoordsAroundCenter(obj.startCoords, groupRotateData.center, currentAngle));
                else if (obj.layer.setLatLng) obj.layer.setLatLng(rotateCoordsAroundCenter(obj.startCoords, groupRotateData.center, currentAngle)[0]);
            });
        }
        
        function handleRotateEnd(e) { groupRotateData = null; }

        // Bind events globally
        map.on('layeradd', e => {
            if (e.layer && typeof e.layer.on === 'function') {
                e.layer.on('pm:dragstart', handleDragStart);
                e.layer.on('pm:drag', handleDrag);
                e.layer.on('pm:dragend', handleDragEnd);
                e.layer.on('pm:rotatestart', handleRotateStart);
                e.layer.on('pm:rotate', handleRotate);
                e.layer.on('pm:rotateend', handleRotateEnd);
            }
        });
        
        // Also bind to map directly for Geoman map events
        map.on('pm:dragstart', handleDragStart);
        map.on('pm:drag', handleDrag);
        map.on('pm:dragend', handleDragEnd);
        map.on('pm:rotatestart', handleRotateStart);
        map.on('pm:rotate', handleRotate);
        map.on('pm:rotateend', handleRotateEnd);

        // Helper to translate GeoJSON coordinates preserving real-world meters
        function translateGeoJSON(geojsonData, shapeCenter, mapCenter) {
            delete geojsonData.bbox; // Strip bbox so bounds are recalculated
            
            const cosShape = Math.cos(shapeCenter.lat * Math.PI / 180);
            const cosMap = Math.cos(mapCenter.lat * Math.PI / 180);
            const scaleLng = cosShape / cosMap;
            
            function shiftPoint(coord) {
                const dLng = coord[0] - shapeCenter.lng;
                const dLat = coord[1] - shapeCenter.lat;
                
                coord[0] = mapCenter.lng + (dLng * scaleLng);
                coord[1] = mapCenter.lat + dLat;
            }

            function traverse(data) {
                if (data.type === 'FeatureCollection') {
                    data.features.forEach(f => traverse(f));
                } else if (data.type === 'Feature') {
                    traverse(data.geometry);
                } else if (data.type === 'Point') {
                    shiftPoint(data.coordinates);
                } else if (data.type === 'MultiPoint' || data.type === 'LineString') {
                    data.coordinates.forEach(coord => shiftPoint(coord));
                } else if (data.type === 'MultiLineString' || data.type === 'Polygon') {
                    data.coordinates.forEach(ring => ring.forEach(coord => shiftPoint(coord)));
                } else if (data.type === 'MultiPolygon') {
                    data.coordinates.forEach(poly => poly.forEach(ring => ring.forEach(coord => shiftPoint(coord))));
                }
            }
            
            traverse(geojsonData);
        }

        // Load Pretraced Track Logic
        document.getElementById('pretraced-select').addEventListener('change', async function(e) {
            const filename = e.target.value;
            if (!filename) return;

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error("Could not load " + filename);
                const geojsonData = await response.json();

                const shouldTeleport = document.getElementById('teleport-shape-checkbox').checked;
                if (shouldTeleport) {
                    const tempLayer = L.geoJSON(geojsonData);
                    const shapeCenter = tempLayer.getBounds().getCenter();
                    const mapCenter = map.getCenter();
                    translateGeoJSON(geojsonData, shapeCenter, mapCenter);
                }

                const shapeName = document.querySelector(`option[value="${filename}"]`).text;
                const importedGroup = L.geoJSON(geojsonData, {
                    style: { color: '#ff2a00', weight: 4, opacity: 1, fillColor: '#ff2a00' }
                }).addTo(map);

                savedShapesData.push({
                    id: (window.forceDropdownTarget = Date.now()),
                    name: shapeName,
                    color: '#ff2a00',
                    layerGroup: importedGroup,
                    originalGeoJson: JSON.parse(JSON.stringify(importedGroup.toGeoJSON()))
                });

                if (!shouldTeleport) {
                    map.fitBounds(importedGroup.getBounds(), { padding: [50, 50] });
                }
                renderSavedList();
                e.target.value = ''; // Reset dropdown
            } catch (err) {
                alert("Error loading track: " + err.message);
                e.target.value = '';
            }
        });

        // 4. Import Shape Logic
        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-import').click());
        document.getElementById('file-import').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            const shapeName = file.name.split('.')[0];
            
            try {
                let geojsonData = null;

                if (ext === 'kmz') {
                    const zip = await JSZip.loadAsync(file);
                    const kmlFile = Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.kml'));
                    if (!kmlFile) throw new Error("No KML file found inside KMZ.");
                    const kmlText = await kmlFile.async("text");
                    const xml = new DOMParser().parseFromString(kmlText, "text/xml");
                    geojsonData = toGeoJSON.kml(xml);
                } else if (ext === 'kml') {
                    const text = await file.text();
                    const xml = new DOMParser().parseFromString(text, "text/xml");
                    geojsonData = toGeoJSON.kml(xml);
                } else if (ext === 'gpx') {
                    const text = await file.text();
                    const xml = new DOMParser().parseFromString(text, "text/xml");
                    geojsonData = toGeoJSON.gpx(xml);
                } else if (ext === 'geojson' || ext === 'json') {
                    const text = await file.text();
                    geojsonData = JSON.parse(text);
                } else {
                    throw new Error("Unsupported file format.");
                }

                if (!geojsonData) throw new Error("Invalid geometry extraction.");

                const shouldTeleport = document.getElementById('teleport-shape-checkbox').checked;
                if (shouldTeleport) {
                    const tempLayer = L.geoJSON(geojsonData);
                    const shapeCenter = tempLayer.getBounds().getCenter();
                    const mapCenter = map.getCenter();
                    translateGeoJSON(geojsonData, shapeCenter, mapCenter);
                }

                const importedGroup = L.geoJSON(geojsonData, {
                    style: { color: '#ff2a00', weight: 4, opacity: 1, fillColor: '#ff2a00' }
                }).addTo(map);

                savedShapesData.push({
                    id: (window.forceDropdownTarget = Date.now()),
                    name: shapeName,
                    color: '#ff2a00',
                    layerGroup: importedGroup,
                    originalGeoJson: JSON.parse(JSON.stringify(importedGroup.toGeoJSON()))
                });

                if (!shouldTeleport) {
                    map.fitBounds(importedGroup.getBounds(), { padding: [50, 50] });
                }
                renderSavedList();

            } catch (err) {
                alert("Error importing file: " + err.message);
            }
            
            e.target.value = '';
        });

        // 5. "Finish Feature" Logic
        document.getElementById('save-shape-btn').addEventListener('click', function() {
            if (activeDrawnLayers.getLayers().length === 0) {
                alert("Please trace a shape on the map first using the toolbar.");
                return;
            }

            const targetId = document.getElementById('save-target-select').value;

            if (targetId === 'new') {
                const nameInput = document.getElementById('shape-name').value.trim();
                const shapeName = nameInput !== '' ? nameInput : `Shape ${savedShapesData.length + 1}`;
                
                const geojsonData = activeDrawnLayers.toGeoJSON();
                activeDrawnLayers.clearLayers();

                const permanentGroup = L.geoJSON(geojsonData, {
                    style: {
                        color: '#ff2a00',
                        weight: 4,
                        opacity: 1,
                        fillColor: '#ff2a00'
                    }
                }).addTo(map);

                savedShapesData.push({
                    id: (window.forceDropdownTarget = Date.now()),
                    name: shapeName,
                    color: '#ff2a00',
                    layerGroup: permanentGroup,
                    originalGeoJson: JSON.parse(JSON.stringify(geojsonData)) 
                });

                document.getElementById('shape-name').value = '';
            } else {
                const targetShape = savedShapesData.find(s => s.id == targetId);
                if (targetShape) {
                    const geojsonData = activeDrawnLayers.toGeoJSON();
                    activeDrawnLayers.clearLayers();
                    
                    const newLayers = L.geoJSON(geojsonData, {
                        style: {
                            color: targetShape.color,
                            weight: 4,
                            opacity: 1,
                            fillColor: targetShape.color
                        }
                    });

                    // Add the new layers into the existing layerGroup
                    newLayers.eachLayer(layer => {
                        targetShape.layerGroup.addLayer(layer);
                    });
                }
            }
            
            renderSavedList();
        });

        // 6. Render Saved List
        function renderSavedList() {
            const listContainer = document.getElementById('saved-list');
            listContainer.innerHTML = '';

            const targetSelect = document.getElementById('save-target-select');
            const currentTargetValue = targetSelect.value;
            targetSelect.innerHTML = '<option value="new">Create new layer</option>';

            savedShapesData.forEach(shape => {
                // Populate dropdown
                const option = document.createElement('option');
                option.value = shape.id;
                option.textContent = `Add to: ${shape.name}`;
                targetSelect.appendChild(option);

                const itemDiv = document.createElement('div');
                itemDiv.className = 'saved-item';
                
                let subLayersHtml = '';
                const layers = getAllLeafLayers(shape.layerGroup);
                if (layers.length > 1) {
                    subLayersHtml = '<div style="margin: 8px 0; padding: 5px 10px; background: #eee; border-radius: 4px;">';
                    subLayersHtml += '<div style="font-size: 12px; color: #555; margin-bottom: 5px; font-weight: bold;">Grouped Features</div>';
                    layers.forEach((layer, index) => {
                        let layerName = (layer.feature && layer.feature.properties && layer.feature.properties.name) ? layer.feature.properties.name : null;
                        if (!layerName) {
                            const layerType = layer instanceof L.Polygon ? 'Polygon' : (layer instanceof L.Polyline ? 'Line' : 'Marker');
                            layerName = `${layerType} ${index + 1}`;
                        }
                        const subId = layer._leaflet_id;
                        const layerColor = (layer.options && layer.options.color) ? layer.options.color : shape.color;
                        subLayersHtml += `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 13px;">
                                <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 5px;">${layerName}</span>
                                <button onclick="renameSubLayer(${shape.id}, ${subId})" style="background:none; border:none; cursor:pointer; padding:0 3px; font-size: 14px;" title="Rename part">✏️</button>
                                <button onclick="deleteSubLayer(${shape.id}, ${subId})" style="background:none; border:none; cursor:pointer; padding:0 3px; font-size: 14px;" title="Delete part">🗑️</button>
                                <input type="color" value="${layerColor}" onchange="changeSubLayerColor(${shape.id}, ${subId}, this.value)" style="margin-left: 5px;" title="Change part color">
                            </div>
                        `;
                    });
                    subLayersHtml += '</div>';
                }

                itemDiv.innerHTML = `
                    <div class="saved-item-header">
                        <span>${shape.name}</span>
                        <input type="color" class="color-picker" value="${shape.color}" oninput="changeShapeColor(${shape.id}, this.value)" onchange="changeShapeColor(${shape.id}, this.value)" title="Change shape color">
                    </div>
                    ${subLayersHtml}
                    <div class="shape-controls">
                        <button class="btn-teleport" onclick="teleportShape(${shape.id})">Teleport shape to current view</button>
                        <button class="btn-initial" onclick="teleportToInitial(${shape.id})">Teleport to initial location</button>
                        <button class="btn-duplicate" onclick="duplicateShape(${shape.id})">Duplicate</button>
                        <button class="btn-rename" onclick="renameShape(${shape.id})">Rename</button>
                        <button class="btn-delete" onclick="deleteShape(${shape.id})">Delete</button>
                    </div>
                    <div class="export-controls">
                        <button onclick="exportData(${shape.id}, 'geojson')">GeoJSON</button>
                        <button onclick="exportData(${shape.id}, 'gpx')">GPX</button>
                        <button onclick="exportData(${shape.id}, 'kml')">KML</button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
            
            // Restore previously selected option if it still exists
            if (window.forceDropdownTarget && Array.from(targetSelect.options).some(opt => opt.value == window.forceDropdownTarget)) {
                targetSelect.value = window.forceDropdownTarget;
                window.forceDropdownTarget = null;
            } else if (Array.from(targetSelect.options).some(opt => opt.value === currentTargetValue)) {
                targetSelect.value = currentTargetValue;
            } else {
                targetSelect.value = 'new';
            }
            
            // Re-trigger the display logic for the shape-name input just in case
            document.getElementById('shape-name').style.display = targetSelect.value === 'new' ? 'block' : 'none';
        }

        // Color Picker Logic
        window.changeShapeColor = function(id, newColor) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape || !shape.layerGroup) return;

            shape.color = newColor;
            
            // Apply new style to all layers in the group
            getAllLeafLayers(shape.layerGroup).forEach(function(layer) {
                if (typeof layer.setStyle === 'function') {
                    layer.setStyle({ color: newColor, fillColor: newColor });
                    if (!layer.feature) layer.feature = { type: "Feature", properties: {} };
                    if (!layer.feature.properties) layer.feature.properties = {};
                    layer.feature.properties.stroke = newColor;
                    layer.feature.properties.fill = newColor;
                }
            });
            // Optional: Re-render to update sub-layer color pickers, but might disrupt focus.
        };

        window.changeSubLayerColor = function(shapeId, layerId, newColor) {
            const shape = savedShapesData.find(s => s.id === shapeId);
            if (!shape || !shape.layerGroup) return;
            
            const layer = getAllLeafLayers(shape.layerGroup).find(l => l._leaflet_id === layerId);
            if (layer && typeof layer.setStyle === 'function') {
                layer.setStyle({ color: newColor, fillColor: newColor });
                if (!layer.feature) layer.feature = { type: "Feature", properties: {} };
                if (!layer.feature.properties) layer.feature.properties = {};
                layer.feature.properties.stroke = newColor;
                layer.feature.properties.fill = newColor;
            }
        };

        window.renameSubLayer = function(shapeId, layerId) {
            const shape = savedShapesData.find(s => s.id === shapeId);
            if (!shape || !shape.layerGroup) return;
            
            const layer = getAllLeafLayers(shape.layerGroup).find(l => l._leaflet_id === layerId);
            if (!layer) return;

            const currentName = (layer.feature && layer.feature.properties && layer.feature.properties.name) ? layer.feature.properties.name : '';
            const newName = prompt("Enter name for this part:", currentName);
            
            if (newName !== null) {
                if (!layer.feature) layer.feature = { type: "Feature", properties: {} };
                if (!layer.feature.properties) layer.feature.properties = {};
                layer.feature.properties.name = newName.trim();
                renderSavedList();
            }
        };

        window.deleteSubLayer = function(shapeId, layerId) {
            if (!confirm("Delete this part?")) return;
            const shapeIndex = savedShapesData.findIndex(s => s.id === shapeId);
            if (shapeIndex === -1) return;
            const shape = savedShapesData[shapeIndex];
            
            const layer = getAllLeafLayers(shape.layerGroup).find(l => l._leaflet_id === layerId);
            if (layer) {
                removeLayerFromGroup(shape.layerGroup, layer);
                map.removeLayer(layer);
                
                if (getAllLeafLayers(shape.layerGroup).length === 0) {
                    savedShapesData.splice(shapeIndex, 1);
                }
                renderSavedList();
            }
        };

        // 7. Individual Shape Teleport Logic
        window.teleportShape = function(id) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape || !shape.layerGroup) return;

            const mapCenter = map.getCenter();
            const layerCenter = shape.layerGroup.getBounds().getCenter();

            const cosShape = Math.cos(layerCenter.lat * Math.PI / 180);
            const cosMap = Math.cos(mapCenter.lat * Math.PI / 180);
            const scaleLng = cosShape / cosMap;

            getAllLeafLayers(shape.layerGroup).forEach(function(layer) {
                if (typeof layer.getLatLngs === 'function') {
                    const shiftCoords = (coords) => {
                        if (Array.isArray(coords[0])) return coords.map(shiftCoords);
                        return coords.map(cl => {
                            const dLng = cl.lng - layerCenter.lng;
                            const dLat = cl.lat - layerCenter.lat;
                            return L.latLng(mapCenter.lat + dLat, mapCenter.lng + (dLng * scaleLng));
                        });
                    };
                    layer.setLatLngs(shiftCoords(layer.getLatLngs()));
                    layer.redraw();
                } else if (typeof layer.getLatLng === 'function') {
                    const latLng = layer.getLatLng();
                    const dLng = latLng.lng - layerCenter.lng;
                    const dLat = latLng.lat - layerCenter.lat;
                    layer.setLatLng([mapCenter.lat + dLat, mapCenter.lng + (dLng * scaleLng)]);
                }
            });
        };

        // 8. Teleport to Initial Location Logic
        window.teleportToInitial = function(id) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape || !shape.layerGroup || !shape.originalGeoJson) return;

            // Delete current layers
            shape.layerGroup.clearLayers();

            // Re-instantiate from original GeoJSON
            const originalLayer = L.geoJSON(shape.originalGeoJson, {
                style: { color: shape.color, weight: 4, opacity: 1, fillColor: shape.color }
            });

            // Add back to the layer group
            originalLayer.eachLayer(layer => {
                shape.layerGroup.addLayer(layer);
            });

            // Pan back to it
            map.fitBounds(shape.layerGroup.getBounds(), { padding: [50, 50] });
        };

        // 9. Rename Feature Logic
        window.renameShape = function(id) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape) return;

            const newName = prompt("Enter new name for the shape:", shape.name);
            if (newName && newName.trim() !== "") {
                shape.name = newName.trim();
                renderSavedList();
            }
        };

        // 10. Duplicate Feature Logic
        window.duplicateShape = function(id) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape || !shape.layerGroup) return;

            const currentGeoJson = shape.layerGroup.toGeoJSON();
            const newName = shape.name + ' (Copy)';

            const newGroup = L.geoJSON(currentGeoJson, {
                style: {
                    color: shape.color,
                    weight: 4,
                    opacity: 1,
                    fillColor: shape.color
                }
            }).addTo(map);

            savedShapesData.push({
                id: (window.forceDropdownTarget = Date.now()),
                name: newName,
                color: shape.color,
                layerGroup: newGroup,
                originalGeoJson: JSON.parse(JSON.stringify(currentGeoJson))
            });

            renderSavedList();
        };

        // 10. Delete Feature Logic
        window.deleteShape = function(id) {
            if (!confirm("Are you sure you want to delete this feature?")) return;

            const shapeIndex = savedShapesData.findIndex(s => s.id === id);
            if (shapeIndex === -1) return;

            map.removeLayer(savedShapesData[shapeIndex].layerGroup);
            savedShapesData.splice(shapeIndex, 1);
            renderSavedList();
        };

        // 11. Export Logic 
        window.exportData = function(id, format) {
            const shape = savedShapesData.find(s => s.id === id);
            if (!shape) return;

            const latestGeoJson = shape.layerGroup.toGeoJSON();
            let fileContent = '';
            let mimeType = '';
            let fileExtension = '';

            if (format === 'geojson') {
                fileContent = JSON.stringify(latestGeoJson, null, 2);
                mimeType = 'application/geo+json';
                fileExtension = 'geojson';
            } else if (format === 'gpx') {
                try {
                    fileContent = togpx(latestGeoJson);
                    mimeType = 'application/gpx+xml';
                    fileExtension = 'gpx';
                } catch (e) {
                    alert("Error converting shape to GPX. Ensure it is a valid track.");
                    return;
                }
            } else if (format === 'kml') {
                try {
                    fileContent = tokml(latestGeoJson);
                    mimeType = 'application/vnd.google-earth.kml+xml';
                    fileExtension = 'kml';
                } catch (e) {
                    alert("Error converting shape to KML.");
                    return;
                }
            }

            const blob = new Blob([fileContent], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${shape.name.replace(/\s+/g, '_')}.${fileExtension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // 12. Free Place Search Logic
        function performSearch() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const result = data[0];
                        map.setView([parseFloat(result.lat), parseFloat(result.lon)], 16);
                    } else {
                        alert("Location not found. Try being more specific.");
                    }
                })
                .catch(err => {
                    console.error("Search error:", err);
                    alert("Error searching for location.");
                });
        }

        document.getElementById('search-btn').addEventListener('click', performSearch);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
